<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Cyberpunk : New Dawn</title>
<meta name="robots" content="noindex">
<script>
/* GitHub sert cette page pour n'importe quelle adresse inconnue, à n'importe quelle
   profondeur : des liens relatifs y pointeraient à côté. On recalcule donc la racine du
   site depuis l'adresse — /<depot>/ sur github.io, / sur un domaine propre — et on la
   déclare en <base> avant tout le reste, pour que la feuille de style et les liens
   ci-dessous tombent juste. */
(function () {
  var seg = location.pathname.split('/').filter(Boolean);
  var racine = (/\.github\.io$/i.test(location.hostname) && seg.length) ? '/' + seg[0] + '/' : '/';
  document.write('<base href="' + racine + '">');
})();
</script>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="accueil">
<div style="max-width:620px;margin:14vh auto;padding:0 20px">
  <div class="panel">
    <div class="panel-h"><h3>404 — cette page n’existe pas</h3></div>
    <p style="margin:0 0 16px;color:var(--ink-2);line-height:1.6">
      L’adresse demandée ne correspond à rien sur ce site. Elle a peut-être changé,
      ou il manque une lettre.
    </p>
    <div class="row wrap">
      <a class="btn p sm" href="index.html">Accueil</a>
      <a class="btn g sm" href="codex.html">Codex</a>
      <a class="btn g sm" href="creation.html">Création</a>
      <a class="btn g sm" href="fiche.html">Feuille</a>
    </div>
  </div>
</div>
</body>
</html>
